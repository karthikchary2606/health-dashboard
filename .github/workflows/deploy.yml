name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_WEBAPP_NAME: health-dasboard

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Create deployment ZIP
        run: zip -r deploy.zip . --exclude "*.git*" --exclude "*.zip"

      - name: Deploy via Kudu ZIP API
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          # Extract credentials and SCM URL directly from publish profile XML
          USERNAME=$(echo "$PUBLISH_PROFILE" | grep -oP 'userName="\K[^"]+' | head -1)
          PASSWORD=$(echo "$PUBLISH_PROFILE" | grep -oP 'userPWD="\K[^"]+' | head -1)
          SCM_URL=$(echo "$PUBLISH_PROFILE" | grep -oP 'publishUrl="\K[^"]+' | grep scm | head -1)

          echo "Username: $USERNAME"
          echo "SCM URL: $SCM_URL"

          if [ -z "$SCM_URL" ]; then
            echo "❌ Could not extract SCM URL from publish profile"
            exit 1
          fi

          echo "Deploying to https://$SCM_URL/api/zipdeploy ..."

          RESPONSE=$(curl -v -o /tmp/deploy_response.txt -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -u "$USERNAME:$PASSWORD" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            "https://$SCM_URL/api/zipdeploy")

          echo "HTTP Response: $RESPONSE"
          cat /tmp/deploy_response.txt || true

          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 202 ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed with HTTP $RESPONSE"
            exit 1
          fi
