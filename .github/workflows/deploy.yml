name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: health-dashboard-kk
  SCM_URL: health-dashboard-kk.scm.azurewebsites.net

jobs:
  persona-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run dashboard persona E2E
        run: npm run test:e2e

  deploy:
    runs-on: ubuntu-latest
    needs: persona-e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Create deployment ZIP
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          echo "JWT_SECRET=$JWT_SECRET" > .env
          echo "MONGODB_URI=$MONGODB_URI" >> .env
          zip -r deploy.zip . --exclude "*.git*" --exclude "*.zip"

      - name: Deploy via Kudu ZIP API
        env:
          AZURE_DEPLOY_USERNAME: ${{ secrets.AZURE_DEPLOY_USERNAME }}
          AZURE_DEPLOY_PASSWORD: ${{ secrets.AZURE_DEPLOY_PASSWORD }}
        run: |
          echo "Deploying to https://$SCM_URL/api/zipdeploy ..."

          RESPONSE=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -u "${AZURE_DEPLOY_USERNAME}:${AZURE_DEPLOY_PASSWORD}" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            "https://${SCM_URL}/api/zipdeploy")

          echo "HTTP Response: $RESPONSE"
          cat /tmp/deploy_response.txt || true

          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 202 ]; then
            echo "Deployment successful!"
          else
            echo "Deployment failed with HTTP $RESPONSE"
            exit 1
          fi
