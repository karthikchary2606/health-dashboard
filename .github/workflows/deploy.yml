name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_WEBAPP_NAME: health-dasboard-g8duaggrcxaeajbb

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Create deployment ZIP
        run: zip -r deploy.zip . --exclude "*.git*" --exclude "*.zip"

      - name: Deploy via Kudu ZIP API
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          USERNAME=$(echo "$PUBLISH_PROFILE" | grep -oP 'userName="\K[^"]+' | head -1)
          PASSWORD=$(echo "$PUBLISH_PROFILE" | grep -oP 'userPWD="\K[^"]+' | head -1)

          echo "Deploying to $AZURE_WEBAPP_NAME..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -u "$USERNAME:$PASSWORD" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            "https://$AZURE_WEBAPP_NAME.scm.azurewebsites.net/api/zipdeploy")

          echo "HTTP Response: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 202 ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed with HTTP $RESPONSE"
            exit 1
          fi
