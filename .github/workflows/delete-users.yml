name: Delete All Users Except Admin

on:
  workflow_dispatch:
    inputs:
      keep_email:
        description: 'Email to keep'
        required: true
        default: 'karthik@kaha.online'

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci --omit=dev
      - name: Delete users
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          KEEP_EMAIL: ${{ github.event.inputs.keep_email }}
        run: |
          node -e "
          require('dotenv').config();
          const mongoose = require('mongoose');
          const User = require('./models/User');
          async function run() {
            await mongoose.connect(process.env.MONGODB_URI);
            const total = await User.countDocuments();
            const result = await User.deleteMany({ email: { \$ne: process.env.KEEP_EMAIL.toLowerCase() } });
            console.log('Total before:', total);
            console.log('Deleted:', result.deletedCount);
            const remaining = await User.countDocuments();
            console.log('Remaining:', remaining);
            const kept = await User.findOne({ email: process.env.KEEP_EMAIL.toLowerCase() });
            console.log('Kept user:', kept ? kept.email + ' | role:' + kept.role : 'NOT FOUND');
            await mongoose.disconnect();
          }
          run().catch(e => { console.error(e); process.exit(1); });
          "
