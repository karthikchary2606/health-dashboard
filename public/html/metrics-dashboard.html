<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase 5 Metrics Dashboard - Health Kaha</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f7fa;
      padding: 20px;
      color: #333;
    }

    .dashboard {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 32px;
      color: #1a202c;
    }

    .refresh-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .refresh-btn {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .refresh-btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }

    .refresh-btn:active {
      transform: translateY(0);
    }

    .last-updated {
      font-size: 12px;
      color: #999;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .metric-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }

    .metric-card:hover {
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
    }

    .metric-card.healthy {
      border-top: 4px solid #10b981;
    }

    .metric-card.warning {
      border-top: 4px solid #f59e0b;
    }

    .metric-card.excellent {
      border-top: 4px solid #06b6d4;
    }

    .metric-card.strong {
      border-top: 4px solid #8b5cf6;
    }

    .metric-card.insufficient-data {
      border-top: 4px solid #d1d5db;
    }

    .metric-card.needs-attention {
      border-top: 4px solid #f59e0b;
    }

    .metric-title {
      font-size: 14px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .metric-value {
      font-size: 36px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .metric-unit {
      font-size: 14px;
      color: #999;
    }

    .metric-details {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
      font-size: 13px;
      color: #666;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }

    .detail-label {
      color: #999;
    }

    .detail-value {
      color: #1a202c;
      font-weight: 600;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .status-healthy {
      background: #10b981;
    }

    .status-warning {
      background: #f59e0b;
    }

    .status-excellent {
      background: #06b6d4;
    }

    .status-strong {
      background: #8b5cf6;
    }

    .status-insufficient {
      background: #d1d5db;
    }

    .status-needs-attention {
      background: #f59e0b;
    }

    .feedback-grid {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .feedback-grid h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #1a202c;
    }

    .feedback-items {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .feedback-item {
      background: #f9fafb;
      border-radius: 8px;
      padding: 16px;
      border-left: 4px solid #667eea;
    }

    .feedback-metric {
      margin-bottom: 12px;
    }

    .feedback-metric .label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .feedback-metric .value {
      font-size: 24px;
      font-weight: 700;
      color: #1a202c;
    }

    .no-data {
      color: #999;
      text-align: center;
      padding: 40px 20px;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      color: #667eea;
      font-weight: 600;
      padding: 20px;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #fecaca;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .metric-value {
        font-size: 28px;
      }

      .metrics-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <div>
        <h1>📊 Phase 5 Metrics Dashboard</h1>
        <p style="color: #999; margin-top: 4px;">Real-time validation & monitoring metrics</p>
      </div>
      <div class="refresh-controls">
        <button class="refresh-btn" id="refreshBtn">🔄 Refresh Now</button>
        <div class="last-updated" id="timestampDiv">Loading...</div>
      </div>
    </div>

    <div id="errorDiv" class="error" style="display: none;"></div>

    <div class="metrics-grid" id="metricsContainer">
      <div class="loading">Loading metrics...</div>
    </div>

    <div class="feedback-grid">
      <h2>📋 User Feedback</h2>
      <div id="feedbackContainer" class="feedback-items">
        <div class="no-data">No feedback data yet. Survey responses will appear here.</div>
      </div>
    </div>
  </div>

  <script>
    const metricsContainer = document.getElementById('metricsContainer');
    const feedbackContainer = document.getElementById('feedbackContainer');
    const errorDiv = document.getElementById('errorDiv');
    const timestampDiv = document.getElementById('timestampDiv');
    const refreshBtn = document.getElementById('refreshBtn');

    async function loadMetrics() {
      try {
        errorDiv.style.display = 'none';
        metricsContainer.innerHTML = '<div class="loading">Loading metrics...</div>';

        const response = await fetch('/api/metrics');
        if (!response.ok) {
          throw new Error(`Failed to load metrics: ${response.statusText}`);
        }

        const data = await response.json();
        renderMetrics(data);
        renderFeedback(data.feedback);
      } catch (error) {
        errorDiv.textContent = `Error: ${error.message}`;
        errorDiv.style.display = 'block';
        metricsContainer.innerHTML = '<div class="error">Failed to load metrics</div>';
      }
    }

    function renderMetrics(data) {
      const html = `
        <!-- Personalization Performance Card -->
        <div class="metric-card ${data.personalization.status}">
          <div class="metric-title">
            <span class="status-indicator status-${data.personalization.status}"></span>
            Personalization Performance
          </div>
          <div class="metric-value">${data.personalization.avgPlanGenerationMs.toFixed(0)}<span class="metric-unit">ms</span></div>
          <div class="metric-details">
            <div class="detail-row">
              <span class="detail-label">Target</span>
              <span class="detail-value">&lt;150ms ✓</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Total Plans</span>
              <span class="detail-value">${data.personalization.totalPlansGenerated}</span>
            </div>
          </div>
        </div>

        <!-- Cache Efficiency Card -->
        <div class="metric-card ${data.caching.status}">
          <div class="metric-title">
            <span class="status-indicator status-${data.caching.status}"></span>
            Cache Hit Rate
          </div>
          <div class="metric-value">${data.caching.cacheHitRate}</div>
          <div class="metric-details">
            <div class="detail-row">
              <span class="detail-label">Target</span>
              <span class="detail-value">&gt;90% ✓</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Cache Hits</span>
              <span class="detail-value">${data.caching.effectiveDietCacheHits}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Cache Misses</span>
              <span class="detail-value">${data.caching.effectiveDietCacheMisses}</span>
            </div>
          </div>
        </div>

        <!-- User Satisfaction Card -->
        <div class="metric-card ${data.feedback.status}">
          <div class="metric-title">
            <span class="status-indicator status-${data.feedback.status}"></span>
            User Satisfaction
          </div>
          <div class="metric-value">${data.feedback.totalResponses}</div>
          <div class="metric-details">
            <div class="detail-row">
              <span class="detail-label">Responses</span>
              <span class="detail-value">${data.feedback.totalResponses}</span>
            </div>
            ${data.feedback.totalResponses > 0 ? `
            <div class="detail-row">
              <span class="detail-label">Avg Meal Satisfaction</span>
              <span class="detail-value">${data.feedback.averageMealSatisfaction}/4 ⭐</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Avg Personalization Match</span>
              <span class="detail-value">${data.feedback.averagePersonalizationMatch}/4 ⭐</span>
            </div>
            ` : '<div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">Awaiting responses</span></div>'}
          </div>
        </div>
      `;

      metricsContainer.innerHTML = html;
      timestampDiv.textContent = `Last updated: ${new Date(data.timestamp).toLocaleString()}`;
    }

    function renderFeedback(feedback) {
      if (feedback.totalResponses === 0) {
        feedbackContainer.innerHTML = '<div class="no-data">No feedback data yet. Survey responses will appear here.</div>';
        return;
      }

      const html = `
        <div class="feedback-item">
          <div class="feedback-metric">
            <div class="label">Total Responses</div>
            <div class="value">${feedback.totalResponses}</div>
          </div>
          <div class="feedback-metric">
            <div class="label">Avg Meal Satisfaction</div>
            <div class="value">${feedback.averageMealSatisfaction}/4 ⭐</div>
          </div>
        </div>
        <div class="feedback-item">
          <div class="feedback-metric">
            <div class="label">Avg Personalization Match</div>
            <div class="value">${feedback.averagePersonalizationMatch}/4 ⭐</div>
          </div>
          <div class="feedback-metric">
            <div class="label">Overall Score</div>
            <div class="value">${((parseFloat(feedback.averageMealSatisfaction) + parseFloat(feedback.averagePersonalizationMatch)) / 2).toFixed(1)}/4</div>
          </div>
        </div>
      `;
      feedbackContainer.innerHTML = html;
    }

    refreshBtn.addEventListener('click', loadMetrics);
    loadMetrics();

    // Auto-refresh every 30 seconds
    setInterval(loadMetrics, 30000);
  </script>
</body>
</html>
