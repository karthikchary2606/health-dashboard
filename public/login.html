<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praana — Sign In</title>
<link rel="stylesheet" href="/css/design-system.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: var(--space-6) var(--space-4);
  }

  .login-brand {
    width: 64px;
    height: 64px;
    border-radius: var(--radius-xl);
    background: linear-gradient(135deg, var(--color-accent-teal), var(--color-accent-gold));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: var(--font-weight-bold);
    color: var(--color-bg-dark);
    margin-bottom: var(--space-8);
  }

  .login-heading {
    font-size: var(--font-size-h1);
    font-weight: var(--font-weight-bold);
    color: var(--color-text-primary);
    margin-bottom: var(--space-2);
    text-align: center;
  }

  .login-subheading {
    font-size: var(--font-size-body);
    color: var(--color-text-secondary);
    margin-bottom: var(--space-8);
    text-align: center;
  }

  .login-form-wrap {
    width: 100%;
    max-width: 400px;
  }

  .login-tabs {
    display: flex;
    gap: var(--space-1);
    margin-bottom: var(--space-6);
    background-color: var(--color-bg-elevated);
    border-radius: var(--radius-lg);
    padding: var(--space-1);
  }

  .login-tab {
    flex: 1;
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-md);
    border: none;
    background: transparent;
    color: var(--color-text-secondary);
    font-family: var(--font-family);
    font-size: var(--font-size-small);
    font-weight: var(--font-weight-medium);
    cursor: pointer;
    transition: all var(--transition-fast);
    min-height: 40px;
  }

  .login-tab.active {
    background-color: var(--color-bg-card);
    color: var(--color-text-primary);
    box-shadow: var(--shadow-sm);
  }

  .error-msg {
    background-color: rgba(255, 107, 107, 0.1);
    border: 1px solid rgba(255, 107, 107, 0.3);
    color: var(--color-danger);
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-md);
    font-size: var(--font-size-small);
    margin-top: var(--space-3);
    display: none;
  }

  .success-msg {
    background-color: rgba(78, 204, 163, 0.1);
    border: 1px solid rgba(78, 204, 163, 0.3);
    color: var(--color-success);
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-md);
    font-size: var(--font-size-small);
    margin-top: var(--space-3);
    display: none;
  }

  .login-footer {
    margin-top: var(--space-6);
    font-size: var(--font-size-small);
    color: var(--color-text-secondary);
    text-align: center;
  }

  .login-footer a {
    color: var(--color-accent-teal);
    text-decoration: none;
    font-weight: var(--font-weight-medium);
  }
</style>
</head>
<body>
  <div class="login-brand">H</div>
  <h1 class="login-heading">Welcome back</h1>
  <p class="login-subheading">Sign in to your health dashboard</p>

  <div class="login-form-wrap">
    <div class="login-tabs">
      <button class="login-tab tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="login-tab tab" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="form-login" style="display:flex;flex-direction:column;gap:var(--space-4);" onsubmit="doLogin();return false;">
      <div class="input-group">
        <label class="input-label" for="login-email">Email</label>
        <input class="input" type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="input-group">
        <label class="input-label" for="login-password">Password</label>
        <input class="input" type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn--primary btn--full btn--lg" style="margin-top:var(--space-2);">Sign In</button>
      <div class="error-msg" id="login-error"></div>
    </form>

    <!-- REGISTER FORM -->
    <form id="form-register" style="display:none;flex-direction:column;gap:var(--space-4);" onsubmit="doRegister();return false;">
      <div class="input-group">
        <label class="input-label" for="reg-name">Full Name</label>
        <input class="input" type="text" id="reg-name" placeholder="Your name" required>
      </div>
      <div class="input-group">
        <label class="input-label" for="reg-email">Email</label>
        <input class="input" type="email" id="reg-email" placeholder="you@example.com" required>
      </div>
      <div class="input-group">
        <label class="input-label" for="reg-password">Password (min 8 characters)</label>
        <input class="input" type="password" id="reg-password" placeholder="••••••••" minlength="8" required>
      </div>
      <button type="submit" class="btn btn--primary btn--full btn--lg" style="margin-top:var(--space-2);">Request Access</button>
      <div class="error-msg" id="reg-error"></div>
      <div class="success-msg" id="reg-success"></div>
    </form>
  </div>

  <p class="login-footer">
    Don't have an account?
    <a href="/profile-complete.html">Get started</a>
  </p>

<script>
function switchTab(tab) {
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }
    window.location.href = data.role === 'admin' ? '/index.html' : '/index.html';
  } catch (e) {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.style.display = 'block';
  }
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const errEl = document.getElementById('reg-error');
  const sucEl = document.getElementById('reg-success');
  errEl.style.display = 'none'; sucEl.style.display = 'none';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }
    sucEl.textContent = '✅ Account created! Signing you in…';
    sucEl.style.display = 'block';
    // Auto-login after registration
    setTimeout(async () => {
      const loginRes = await fetch('/api/auth/login', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      if (loginRes.ok) {
        window.location.href = '/index.html';
      } else {
        // Fallback: switch to login tab with email pre-filled
        switchTab('login');
        document.getElementById('login-email').value = email;
        document.getElementById('login-password').focus();
      }
    }, 800);
  } catch (e) {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.style.display = 'block';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const active = document.getElementById('form-login').style.display !== 'none';
    if (active) doLogin(); else doRegister();
  }
});

// If already logged in, redirect to app
fetch('/api/auth/me', { credentials: 'include' })
  .then(r => { if (r.ok) window.location.href = '/index.html'; })
  .catch(() => {});
</script>
</body>
</html>
