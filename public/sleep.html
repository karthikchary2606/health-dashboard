<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b4332">
<title>Praana — Sleep</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1b4332;
  --primary-light: #2d6a4f;
  --accent: #f4a261;
  --card: #ffffff;
  --bg: #f0f4f0;
  --text: #1a1a2e;
  --text-med: #4a5568;
  --text-light: #718096;
  --border: #e2e8f0;
  --shadow: 0 2px 8px rgba(0,0,0,.08);
  --radius: 12px;
  --radius-sm: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;visibility:hidden}

/* ── NAV ── */
.topbar{background:var(--primary);color:#fff;padding:0 24px;display:flex;align-items:stretch;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar-brand{display:flex;align-items:center;gap:10px;font-size:.92rem;font-weight:700;color:#95d5b2;text-decoration:none;padding-right:24px;border-right:1px solid rgba(255,255,255,.12);margin-right:8px}
.nav-links{display:flex;align-items:stretch;flex:1;gap:2px}
.nav-link{display:flex;align-items:center;gap:7px;padding:0 14px;font-size:.82rem;font-weight:500;color:rgba(255,255,255,.7);text-decoration:none;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.nav-link:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav-link.active{color:#fff;border-bottom-color:var(--accent);font-weight:600;background:rgba(255,255,255,.08)}
.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;padding-left:16px}
.topbar-right a{color:rgba(255,255,255,.65);font-size:.78rem;text-decoration:none;transition:.2s}
.topbar-right a:hover{color:#fff}
.btn-signout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.75rem;font-weight:600;transition:.2s}
.btn-signout:hover{background:rgba(255,255,255,.18)}

/* ── LAYOUT ── */
.container{max-width:860px;margin:0 auto;padding:28px 20px 60px}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;border-top:3px solid var(--primary)}
.card + .card{margin-top:20px}
.card-title{font-size:.95rem;font-weight:700;color:var(--primary);margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* ── FORM ── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.8rem;font-weight:600;color:var(--text-med);margin-bottom:5px}
.form-group input[type="date"],
.form-group input[type="time"],
.form-group input[type="number"],
.form-group textarea{
  width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-family:inherit;font-size:.88rem;outline:none;transition:.2s;background:#fff;color:var(--text)
}
.form-group input:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-group textarea{resize:vertical;min-height:72px}
.duration-hint{font-size:.82rem;font-weight:700;margin-top:6px;min-height:20px}
.divider-or{text-align:center;font-size:.78rem;color:var(--text-light);font-weight:600;padding:6px 0;letter-spacing:.5px}

/* ── EMOJI QUALITY PICKER ── */
.emoji-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.emoji-btn{font-size:1.6rem;background:none;border:none;cursor:pointer;opacity:.35;transform:scale(1);transition:opacity .15s,transform .15s;padding:2px}

/* ── SAVE BUTTON ── */
.btn-save{display:block;width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;transition:.2s;margin-top:6px}
.btn-save:hover{background:var(--primary-light)}
.btn-save:active{transform:scale(.98)}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;border-left:4px solid var(--primary)}
.stat-card .s-lbl{font-size:.7rem;color:var(--text-light);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-card .s-val{font-size:1.5rem;font-weight:800;color:var(--primary)}

/* ── CHART ── */
.chart-wrap{position:relative;height:220px}

/* ── TABLE ── */
.sleep-table{width:100%;border-collapse:collapse;font-size:.85rem}
.sleep-table th{background:#f8fafb;padding:9px 12px;text-align:left;font-weight:700;color:var(--primary);border-bottom:2px solid var(--border);font-size:.75rem;text-transform:uppercase;letter-spacing:.5px}
.sleep-table td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-med);vertical-align:middle}
.sleep-table tr:last-child td{border-bottom:none}
.sleep-table tr:hover td{background:#f8fafb}
.table-empty{text-align:center;padding:32px 0;color:var(--text-light);font-size:.88rem}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .nav-links .nav-link:not(.active){display:none}
  .stat-grid{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
  .container{padding:18px 14px 60px}
  .card{padding:16px}
}
@media(max-width:480px){
  .stat-grid{grid-template-columns:1fr 1fr}
  .topbar{padding:0 12px}
  .topbar-brand{font-size:.82rem;padding-right:12px}
}
</style>
</head>
<body>

<!-- ── NAV ── -->
<nav class="topbar">
  <a class="topbar-brand" href="/index.html">💚 Praana</a>
  <div class="nav-links">
    <a class="nav-link" href="/index.html">🏠 Dashboard</a>
    <a class="nav-link active" href="/sleep.html">😴 Sleep</a>
    <a class="nav-link" href="/settings.html">⚙️ Settings</a>
  </div>
  <div class="topbar-right">
    <button class="btn-signout" onclick="logout()">Sign Out</button>
  </div>
</nav>

<!-- ── MAIN CONTENT ── -->
<div class="container">

  <!-- 1. Log Form -->
  <div class="card">
    <div class="card-title">😴 Log Sleep</div>

    <div class="form-row">
      <div class="form-group">
        <label for="sleepDate">Date</label>
        <input type="date" id="sleepDate">
      </div>
      <div></div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="bedtime">Bedtime</label>
        <input type="time" id="bedtime">
      </div>
      <div class="form-group">
        <label for="wakeTime">Wake Time</label>
        <input type="time" id="wakeTime">
      </div>
    </div>
    <div class="duration-hint" id="durationDisplay"></div>

    <div class="divider-or">— OR enter total hours —</div>

    <div class="form-group" style="max-width:200px">
      <label for="manualHours">Total Sleep (hours)</label>
      <input type="number" id="manualHours" min="0" max="24" step="0.5" placeholder="e.g. 7.5">
    </div>

    <div class="form-group">
      <label>Sleep Quality</label>
      <div class="emoji-row">
        <button class="emoji-btn" data-val="1" title="Terrible">😩</button>
        <button class="emoji-btn" data-val="2" title="Poor">😴</button>
        <button class="emoji-btn" data-val="3" title="Okay">😐</button>
        <button class="emoji-btn" data-val="4" title="Good">😊</button>
        <button class="emoji-btn" data-val="5" title="Excellent">🤩</button>
      </div>
    </div>

    <div class="form-group">
      <label for="sleepNotes">Notes (optional)</label>
      <textarea id="sleepNotes" placeholder="e.g. Woke up once, vivid dreams…"></textarea>
    </div>

    <button class="btn-save" id="saveSleepBtn">Save Sleep Entry</button>
  </div>

  <!-- 2. Insight Cards -->
  <div class="stat-grid">
    <div class="stat-card">
      <div class="s-lbl">Avg This Week</div>
      <div class="s-val" id="statAvgHours">—</div>
    </div>
    <div class="stat-card" style="border-left-color:#f4a261">
      <div class="s-lbl">Goal Nights</div>
      <div class="s-val" id="statGoalNights">—</div>
    </div>
    <div class="stat-card" style="border-left-color:#6366f1">
      <div class="s-lbl">Avg Quality</div>
      <div class="s-val" id="statAvgQuality">—</div>
    </div>
    <div class="stat-card" style="border-left-color:#22c55e">
      <div class="s-lbl">Current Streak</div>
      <div class="s-val" id="statStreak">—</div>
    </div>
  </div>

  <!-- 3. 7-Day Chart -->
  <div class="card" style="margin-top:20px">
    <div class="card-title">📊 Last 7 Nights</div>
    <div class="chart-wrap">
      <canvas id="sleepChart"></canvas>
    </div>
    <div style="display:flex;gap:16px;margin-top:12px;font-size:.75rem;color:var(--text-light)">
      <span><span style="display:inline-block;width:10px;height:10px;background:#22c55e;border-radius:2px;margin-right:4px"></span>≥7.5h</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:#6366f1;border-radius:2px;margin-right:4px"></span>&lt;7.5h</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:#e2e8f0;border-radius:2px;margin-right:4px"></span>Not logged</span>
    </div>
  </div>

  <!-- 4. Recent Nights Table -->
  <div class="card" style="margin-top:20px">
    <div class="card-title">🗓️ Recent Nights</div>
    <div class="table-empty" id="sleepTableEmpty">No sleep entries yet. Log your first night above.</div>
    <table class="sleep-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Duration</th>
          <th>Quality</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody id="sleepTableBody"></tbody>
    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sleep.js"></script>

<!-- Bottom Navigation (mobile) -->
<nav class="bottom-nav" role="navigation" aria-label="Main navigation" style="display:none">
  <button class="nav-item" data-nav="dashboard" aria-label="Dashboard">
    <span class="nav-item__icon">⊞</span>
    <span class="nav-item__label">Home</span>
  </button>
  <button class="nav-item" data-nav="diet" aria-label="Diet">
    <span class="nav-item__icon">🥗</span>
    <span class="nav-item__label">Diet</span>
  </button>
  <button class="nav-item" data-nav="workouts" aria-label="Workouts">
    <span class="nav-item__icon">💪</span>
    <span class="nav-item__label">Workouts</span>
  </button>
  <button class="nav-item" data-nav="progress" aria-label="Progress">
    <span class="nav-item__icon">📈</span>
    <span class="nav-item__label">Progress</span>
  </button>
  <button class="nav-item" data-nav="settings" aria-label="Settings">
    <span class="nav-item__icon">⚙</span>
    <span class="nav-item__label">Settings</span>
  </button>
</nav>

<!-- Sidebar Navigation (tablet/desktop) -->
<nav class="sidebar-nav" role="navigation" aria-label="Main navigation" style="display:none">
  <a href="/index.html" class="sidebar-nav__logo">
    <div class="sidebar-nav__logo-mark">H</div>
    <span class="sidebar-nav__app-name">Praana</span>
  </a>
  <div class="sidebar-nav__section">
    <p class="sidebar-nav__section-label">Main</p>
    <button class="nav-item" data-nav="dashboard">
      <span class="nav-item__icon">⊞</span>
      <span class="nav-item__label">Dashboard</span>
    </button>
    <button class="nav-item" data-nav="diet">
      <span class="nav-item__icon">🥗</span>
      <span class="nav-item__label">Diet</span>
    </button>
    <button class="nav-item" data-nav="workouts">
      <span class="nav-item__icon">💪</span>
      <span class="nav-item__label">Workouts</span>
    </button>
    <button class="nav-item" data-nav="progress">
      <span class="nav-item__icon">📈</span>
      <span class="nav-item__label">Progress</span>
    </button>
  </div>
  <div class="sidebar-nav__footer">
    <button class="nav-item" data-nav="settings">
      <span class="nav-item__icon">⚙</span>
      <span class="nav-item__label">Settings</span>
    </button>
  </div>
</nav>
<script src="/js/bottom-nav.js"></script>
</body>
</html>
